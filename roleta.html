<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Roleta Hinoportuna</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <style>
        body { background: #111; color: white; text-align: center; font-family: sans-serif; overflow: hidden; margin: 0; }
        #resultado { font-size: 3rem; font-weight: bold; margin: 20px; color: #ffcc00; height: 60px; text-shadow: 2px 2px #000; }
        #canvas-container { position: relative; width: 550px; height: 550px; margin: 0 auto; }
        canvas { border: 15px solid #333; border-radius: 50%; box-shadow: 0 0 50px rgba(0,0,0,0.5); }
        .seta { position: absolute; top: -25px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 25px solid transparent; border-right: 25px solid transparent; border-top: 50px solid #ff0000; z-index: 20; }
        #ze-central { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 110px; z-index: 15; border-radius: 50%; background: white; padding: 5px; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.05); } 100% { transform: translate(-50%, -50%) scale(1); } }
        .logo-top { width: 120px; margin-top: 10px; }
    </style>
</head>
<body>

<img src="logo_hinoportuna.png" class="logo-top">
<div id="resultado">Aguardando Tunante...</div>

<div id="canvas-container">
    <div class="seta"></div>
    <img src="ze_chupeta.png" id="ze-central">
    <canvas id="wheel" width="550" height="550"></canvas>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBVH7T8fgOQhwny3jolprJCLmbCjHBMmGQ",
        authDomain: "roleta-lethes.firebaseapp.com",
        databaseURL: "https://roleta-lethes-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "roleta-lethes",
        storageBucket: "roleta-lethes.firebasestorage.app",
        messagingSenderId: "539471979058",
        appId: "1:539471979058:web:e1636f48c93e0e50e0922b"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const canvas = document.getElementById("wheel");
    const ctx = canvas.getContext("2d");
    let premiosAtuais = [];
    const cores = ["#005ea8", "#32CD32", "#ffcc00", "#000000", "#ff4444", "#9b59b6"];

    db.ref('configuracao_premios').on('value', (snap) => {
        premiosAtuais = snap.val() || [];
        desenharRoleta();
    });

    function desenharRoleta() {
        if (premiosAtuais.length === 0) return;
        const total = premiosAtuais.length;
        const slice = (Math.PI * 2) / total;
        ctx.clearRect(0,0,550,550);
        premiosAtuais.forEach((p, i) => {
            ctx.beginPath();
            ctx.fillStyle = cores[i % cores.length];
            ctx.moveTo(275, 275);
            ctx.arc(275, 275, 275, i * slice, (i + 1) * slice);
            ctx.fill();
            ctx.save();
            ctx.translate(275, 275);
            ctx.rotate(i * slice + slice/2);
            ctx.fillStyle = "white";
            ctx.font = "bold 18px sans-serif";
            ctx.textAlign = "right";
            ctx.fillText(p.n, 240, 10);
            ctx.restore();
        });
    }

    db.ref('pedidos').on('child_added', (snapshot) => {
        const dados = snapshot.val();
        if (dados && dados.nome && premiosAtuais.length > 0) {
            document.getElementById('resultado').innerText = dados.nome + " a girar...";
            
            // 1. SORTEIO LÓGICO
            let random = Math.random() * 100;
            let acumulado = 0;
            let escolhidoIdx = 0;
            for(let i=0; i < premiosAtuais.length; i++) {
                acumulado += premiosAtuais[i].p;
                if(random <= acumulado) { escolhidoIdx = i; break; }
            }

            // 2. CÁLCULO VISUAL (Sincronizar a fatia com a seta no topo)
            const grausPorFatia = 360 / premiosAtuais.length;
            // O '- 90' ajusta o início do desenho para o topo
            const anguloSorteado = (escolhidoIdx * grausPorFatia) + (grausPorFatia / 2);
            const rotacaoFinal = 3600 + (360 - anguloSorteado); 

            canvas.style.transition = "transform 5s cubic-bezier(0.15, 0, 0.15, 1)";
            canvas.style.transform = `rotate(${rotacaoFinal}deg)`;

            setTimeout(() => {
                const ganhou = premiosAtuais[escolhidoIdx];
                document.getElementById('resultado').innerText = "Ganhaste: " + ganhou.n + "!";
                
                // 3. ATUALIZAR STOCK E HISTÓRICO
                if (ganhou.s > 0) {
                    db.ref(`configuracao_premios/${escolhidoIdx}/s`).set(ganhou.s - 1);
                }

                db.ref('historico').push({
                    nome: dados.nome,
                    premio: ganhou.n,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                });

                db.ref('pedidos/' + snapshot.key).remove();
                
                setTimeout(() => {
                    canvas.style.transition = "none";
                    canvas.style.transform = `rotate(${rotacaoFinal % 360}deg)`;
                }, 500);
            }, 5500);
        }
    });
</script>
</body>
</html>
