<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Roleta Hinoportuna - Monitor</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <style>
        body { 
            background: #111; 
            color: white; 
            text-align: center; 
            font-family: sans-serif; 
            overflow: hidden; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
        }
        
        /* QR Code de Jogar (Esquerda) */
        #qr-jogar { 
            position: absolute; 
            left: 50px; 
            top: 50%; 
            transform: translateY(-50%); 
            z-index: 100; 
            text-align: center; 
        }
        
        /* QR Code das Redes (Direita) */
        #qr-redes { 
            position: absolute; 
            right: 50px; 
            top: 50%; 
            transform: translateY(-50%); 
            z-index: 100; 
            text-align: center; 
        }

        .qr-img { width: 260px; height: auto; border-radius: 10px; display: block; }
        .qr-text { margin-top: 15px; font-weight: bold; font-size: 1.3rem; color: #ffcc00; text-shadow: 2px 2px #000; max-width: 260px; }
        
        #resultado { 
            font-size: 4rem; 
            font-weight: bold; 
            margin-bottom: 20px; 
            color: #ffcc00; 
            text-shadow: 4px 4px #000; 
            height: 90px; 
            width: 100%;
            z-index: 10;
        }
        
        #canvas-container { 
            position: relative; 
            width: 600px; 
            height: 600px; 
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        canvas { 
            border: 15px solid #333; 
            border-radius: 50%; 
            background: #222; 
            box-shadow: 0 0 60px rgba(0,0,0,0.7); 
        }
        
        .seta { 
            position: absolute; 
            top: -25px; 
            left: 50%; 
            transform: translateX(-50%); 
            width: 0; 
            height: 0; 
            border-left: 30px solid transparent; 
            border-right: 30px solid transparent; 
            border-top: 55px solid #ff0000; 
            z-index: 50; 
        }
        
        #ze-central { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            width: 120px; 
            z-index: 60; 
            border-radius: 50%; 
            background: white; 
            padding: 5px; 
        }
        
        .logo-top { width: 150px; margin-bottom: 10px; z-index: 10; }
    </style>
</head>
<body>

<div id="qr-jogar">
    <img src="qr_code_lethes.png" class="qr-img">
    <div class="qr-text">SCAN PARA JOGAR</div>
</div>

<div id="qr-redes">
    <img src="qr_code_redes_hinoportuna.png" class="qr-img">
    <div class="qr-text">SEGUE AS NOSSAS REDES SOCIAIS</div>
</div>

<img src="logo_hinoportuna.png" class="logo-top">
<div id="resultado">Aguardando Tunante...</div>

<div id="canvas-container">
    <div class="seta"></div>
    <img src="ze_chupeta.png" id="ze-central">
    <canvas id="wheel" width="600" height="600"></canvas>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBVH7T8fgOQhwny3jolprJCLmbCjHBMmGQ",
        authDomain: "roleta-lethes.firebaseapp.com",
        databaseURL: "https://roleta-lethes-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "roleta-lethes",
        appId: "1:539471979058:web:e1636f48c93e0e50e0922b"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const canvas = document.getElementById("wheel");
    const ctx = canvas.getContext("2d");
    const cw = 300, ch = 300;
    let premiosAtuais = [];
    const cores = ["#005ea8", "#32CD32", "#ffcc00", "#111", "#ff4444", "#9b59b6", "#e67e22", "#1abc9c"];

    db.ref('configuracao_premios').on('value', (snap) => {
        premiosAtuais = snap.val() || [];
        desenharRoleta();
    });

    function desenharRoleta() {
        if (premiosAtuais.length === 0) return;
        const total = premiosAtuais.length;
        const slice = (Math.PI * 2) / total;
        ctx.clearRect(0,0,600,600);
        premiosAtuais.forEach((p, i) => {
            const startAngle = (i * slice) - (Math.PI / 2);
            const endAngle = ((i + 1) * slice) - (Math.PI / 2);
            ctx.beginPath();
            ctx.fillStyle = cores[i % cores.length];
            ctx.moveTo(cw, ch);
            ctx.arc(cw, ch, cw, startAngle, endAngle);
            ctx.fill();
            ctx.save();
            ctx.translate(cw, ch);
            ctx.rotate(startAngle + slice/2);
            ctx.fillStyle = "white";
            ctx.font = "bold 20px sans-serif";
            ctx.textAlign = "right";
            ctx.fillText(p.n, cw - 30, 8);
            ctx.restore();
        });
    }

    db.ref('pedidos').on('child_added', (snapshot) => {
        const dados = snapshot.val();
        if (dados && dados.nome && premiosAtuais.length > 0) {
            document.getElementById('resultado').innerText = dados.nome + " a girar...";
            let random = Math.random() * 100, acumulado = 0, escolhidoIdx = 0;
            for(let i=0; i < premiosAtuais.length; i++) {
                acumulado += premiosAtuais[i].p;
                if(random <= acumulado) { escolhidoIdx = i; break; }
            }

            const grausPorFatia = 360 / premiosAtuais.length;
            const compensacaoCentro = grausPorFatia / 2;
            const rotacaoFinal = 3600 + (360 - (escolhidoIdx * grausPorFatia)) - compensacaoCentro; 

            canvas.style.transition = "transform 5s cubic-bezier(0.1, 0, 0.1, 1)";
            canvas.style.transform = `rotate(${rotacaoFinal}deg)`;

            setTimeout(() => {
                const ganhou = premiosAtuais[escolhidoIdx];
                const resDiv = document.getElementById('resultado');

                // Lógica para remover o "Ganhaste" se for Tenta Outra Vez
                if (ganhou.n.toLowerCase().includes("tenta outra vez")) {
                    resDiv.innerText = "Tenta outra vez!";
                } else {
                    resDiv.innerText = "Ganhaste: " + ganhou.n + "!";
                }

                db.ref('historico').push({ nome: dados.nome, premio: ganhou.n, timestamp: firebase.database.ServerValue.TIMESTAMP });
                if (ganhou.s > 0) db.ref(`configuracao_premios/${escolhidoIdx}/s`).set(ganhou.s - 1);
                db.ref('pedidos/' + snapshot.key).remove();
                
                setTimeout(() => {
                    canvas.style.transition = "none";
                    canvas.style.transform = `rotate(${rotacaoFinal % 360}deg)`;
                }, 500);
            }, 5500);
        }
    });
</script>
</body>
</html>
