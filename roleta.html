<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Roleta Hinoportuna</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <style>
        body { background: #111; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; overflow: hidden; height: 100vh; margin: 0; }
        #header-logo { width: 150px; margin-top: 20px; }
        #resultado { font-size: 2.5rem; margin: 20px; color: #ffcc00; font-weight: bold; text-shadow: 2px 2px #000; height: 60px; }
        .canvas-container { position: relative; width: 500px; height: 500px; }
        canvas { border-radius: 50%; border: 10px solid #444; }
        .seta { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 20px solid transparent; border-right: 20px solid transparent; border-top: 40px solid #ff0000; z-index: 10; }
        #ze-central { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100px; z-index: 5; border-radius: 50%; }
    </style>
</head>
<body>
    <img src="logo_hinoportuna.png" id="header-logo">
    <div id="resultado">Aguardando Tunante...</div>
    
    <div class="canvas-container">
        <div class="seta"></div>
        <img src="ze_chupeta.png" id="ze-central">
        <canvas id="wheel" width="500" height="500"></canvas>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBVH7T8fgOQhwny3jolprJCLmbCjHBMmGQ",
            authDomain: "roleta-lethes.firebaseapp.com",
            databaseURL: "https://roleta-lethes-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "roleta-lethes",
            storageBucket: "roleta-lethes.firebasestorage.app",
            messagingSenderId: "539471979058",
            appId: "1:539471979058:web:e1636f48c93e0e50e0922b"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const premios = [
            {n: "Shot Grátis", c: "#005ea8", p: 40},
            {n: "Imperial", c: "#32CD32", p: 10},
            {n: "Tshirt", c: "#ffcc00", p: 5},
            {n: "Tenta outra vez", c: "#444", p: 45}
        ];

        const canvas = document.getElementById("wheel");
        const ctx = canvas.getContext("2d");
        let angle = 0;

        function drawWheel() {
            const slice = (Math.PI * 2) / premios.length;
            premios.forEach((p, i) => {
                ctx.beginPath(); ctx.fillStyle = p.c; ctx.moveTo(250, 250);
                ctx.arc(250, 250, 250, i * slice, (i + 1) * slice); ctx.fill();
                ctx.save(); ctx.translate(250, 250); ctx.rotate(i * slice + slice/2);
                ctx.fillStyle = "white"; ctx.font = "bold 16px sans-serif";
                ctx.fillText(p.n, 100, 10); ctx.restore();
            });
        }
        drawWheel();

        db.ref('pedidos').on('child_added', (snapshot) => {
            const dados = snapshot.val();
            if (dados && dados.nome) {
                document.getElementById('resultado').innerText = dados.nome + " está a girar!";
                
                // Lógica de sorteio simples
                let escolhido = premios[Math.floor(Math.random()*premios.length)].n;
                
                let voltas = 3600 + (Math.random() * 360);
                canvas.style.transition = "transform 4s cubic-bezier(0.15, 0, 0.15, 1)";
                canvas.style.transform = `rotate(${voltas}deg)`;

                setTimeout(() => {
                    document.getElementById('resultado').innerText = "Ganhaste: " + escolhido + "!";
                    canvas.style.transition = "none";
                    canvas.style.transform = "rotate(0deg)";
                    db.ref('pedidos/' + snapshot.key).remove();
                }, 4500);
            }
        });
    </script>
</body>
</html>
