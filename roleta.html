<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Roleta Hinoportuna</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <style>
        body { background: #111; color: white; text-align: center; font-family: sans-serif; overflow: hidden; }
        #canvas-container { position: relative; width: 500px; margin: 20px auto; }
        canvas { border: 10px solid #333; border-radius: 50%; background: #222; }
        .seta { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 20px solid transparent; border-right: 20px solid transparent; border-top: 40px solid red; z-index: 10; }
        #resultado { font-size: 40px; font-weight: bold; margin-top: 20px; color: #ffcc00; height: 50px; }
        .logo { width: 150px; margin-top: 10px; }
    </style>
</head>
<body>

<img src="logo_hinoportuna.png" class="logo">
<div id="resultado">Aguardando Tunante...</div>

<div id="canvas-container">
    <div class="seta"></div>
    <canvas id="wheel" width="500" height="500"></canvas>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBVH7T8fgOQhwny3jolprJCLmbCjHBMmGQ",
        authDomain: "roleta-lethes.firebaseapp.com",
        databaseURL: "https://roleta-lethes-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "roleta-lethes",
        storageBucket: "roleta-lethes.firebasestorage.app",
        messagingSenderId: "539471979058",
        appId: "1:539471979058:web:e1636f48c93e0e50e0922b"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const canvas = document.getElementById("wheel");
    const ctx = canvas.getContext("2d");
    let premiosAtuais = [];
    const cores = ["#005ea8", "#32CD32", "#ffcc00", "#444444", "#ff4444", "#9b59b6", "#e67e22"];

    db.ref('configuracao_premios').on('value', (snap) => {
        premiosAtuais = snap.val() || [];
        desenharRoleta();
    });

    function desenharRoleta() {
        if (premiosAtuais.length === 0) return;
        const total = premiosAtuais.length;
        const slice = (Math.PI * 2) / total;
        ctx.clearRect(0,0,500,500);
        premiosAtuais.forEach((p, i) => {
            ctx.beginPath();
            ctx.fillStyle = cores[i % cores.length];
            ctx.moveTo(250, 250);
            ctx.arc(250, 250, 250, i * slice, (i + 1) * slice);
            ctx.fill();
            ctx.save();
            ctx.translate(250, 250);
            ctx.rotate(i * slice + slice/2);
            ctx.fillStyle = "white";
            ctx.font = "bold 16px sans-serif";
            ctx.fillText(p.n, 100, 5);
            ctx.restore();
        });
    }

   db.ref('pedidos').on('child_added', (snapshot) => {
        const dados = snapshot.val();
        if (dados && dados.nome) {
            document.getElementById('resultado').innerText = dados.nome + " a girar...";
            
            let random = Math.random() * 100;
            let acumulado = 0;
            let escolhidoIdx = -1;

            // Lógica de sorteio baseada nas probabilidades do Admin
            for(let i=0; i < premiosAtuais.length; i++) {
                acumulado += premiosAtuais[i].p;
                if(random <= acumulado) {
                    escolhidoIdx = i;
                    break;
                }
            }

            // Fallback caso a soma não seja 100%
            if (escolhidoIdx === -1) escolhidoIdx = premiosAtuais.length - 1;

            const grausPorFatia = 360 / premiosAtuais.length;
            const anguloFinal = 3600 + (360 - (escolhidoIdx * grausPorFatia) - (grausPorFatia / 2));
            
            canvas.style.transition = "transform 4s cubic-bezier(0.15, 0, 0.15, 1)";
            canvas.style.transform = `rotate(${anguloFinal}deg)`;

            setTimeout(() => {
                const premioGanho = premiosAtuais[escolhidoIdx].n;
                
                // CORREÇÃO: Exibe o nome real do prémio sorteado
                document.getElementById('resultado').innerText = "Ganhaste: " + premioGanho + "!";
                
                // CORREÇÃO: Descontar stock no Firebase
                if (premiosAtuais[escolhidoIdx].s > 0 && premioGanho !== "Tenta outra vez") {
                    let novoStock = premiosAtuais[escolhidoIdx].s - 1;
                    db.ref(`configuracao_premios/${escolhidoIdx}/s`).set(novoStock);
                }

                // CORREÇÃO: Registar nas "Últimas Entradas" antes de apagar o pedido
                db.ref('historico').push({
                    nome: dados.nome,
                    premio: premioGanho,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                });

                db.ref('pedidos/' + snapshot.key).remove();
            }, 4500);
        }
    });
</script>
</body>
</html>
