<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Roleta Hinoportuna - Viana do Castelo</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <style>
        body { background: #000; color: white; font-family: 'Arial', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; margin: 0; }
        
        #header-logo { width: 150px; margin-bottom: 20px; }

        #resultado { font-size: 3rem; font-weight: bold; text-align: center; height: 80px; color: #ffcc00; text-shadow: 2px 2px 10px rgba(255,204,0,0.5); }
        
        .roulette-container { position: relative; width: 600px; height: 600px; border: 15px solid #333; border-radius: 50%; box-shadow: 0 0 80px rgba(0,0,0,0.8); }
        
        canvas { width: 100%; height: 100%; border-radius: 50%; transition: transform 6s cubic-bezier(0.15, 0, 0.15, 1); }
        
        .seta { position: absolute; top: -30px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 25px solid transparent; border-right: 25px solid transparent; border-top: 50px solid #ff0000; z-index: 20; }
        
        /* Zé Chupeta Central Pulsante */
        #ze-central { position: absolute; top: 50%; left: 50%; width: 120px; height: 120px; transform: translate(-50%, -50%); border-radius: 50%; background: white; padding: 10px; border: 5px solid #ffcc00; z-index: 15; box-shadow: 0 0 20px rgba(255,204,0,0.7); animation: pulsar 2s infinite ease-in-out; }

        @keyframes pulsar { 0% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.1); } 100% { transform: translate(-50%, -50%) scale(1); } }

        /* Overlay de Vencedor */
        #vencedor-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .vencedor-content { text-align: center; border: 10px solid #32CD32; padding: 50px; border-radius: 20px; background: rgba(0,0,0,0.5); box-shadow: 0 0 50px #32CD32; }
    </style>
</head>
<body>

    <img src="logo_hinoportuna.png" id="header-logo" alt="Logo Hinoportuna">

    <div id="resultado">Aguardando Tunante para girar...</div>

    <div class="roulette-container">
        <div class="seta"></div>
        
        <img src="ze_chupeta.png" id="ze-central" alt="Zé Chupeta">
        
        <canvas id="wheel" width="600" height="600"></canvas>
    </div>

    <div id="vencedor-overlay">
        <div class="vencedor-content">
            <h1 style="font-size: 5rem; color: #32CD32; margin: 0;">PARABÉNS!</h1>
            <h2 id="nome-vencedor" style="font-size: 4rem; color: #ffcc00; margin: 10px 0;"></h2>
            <p id="premio-vencedor" style="font-size: 2.5rem; color: white;"></p>
            <img src="logo_hinoportuna.png" style="width: 100px; margin-top: 20px;">
        </div>
    </div>

    <script>
        // CONFIGURAÇÃO DO TEU FIREBASE (Utilizando os dados da tua imagem)
        const firebaseConfig = {
            apiKey: "AIzaSyBVH7T8fgOQhwny3jolprJCLmbCjHBMmGQ",
            authDomain: "roleta-lethes.firebaseapp.com",
            databaseURL: "https://roleta-lethes-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "roleta-lethes",
            storageBucket: "roleta-lethes.firebasestorage.app",
            messagingSenderId: "539471979058",
            appId: "1:539471979058:web:e1636f48c93e0e50e0922b",
            measurementId: "G-LC28QJSJ5C"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const canvas = document.getElementById("wheel");
        const ctx = canvas.getContext("2d");
        
        // Esqueleto de cores da Hinoportuna: Azul, Verde, Amarelo, Preto
        const coresHino = ["#00008B", "#32CD32", "#ffcc00", "#000000"];

        let premios = [
            { n: "Ficha Fino", p: 20 }, { n: "Pandeireta", p: 3 },
            { n: "T-Shirt Preta", p: 2 }, { n: "T-Shirt Lethes", p: 2 },
            { n: "T-Shirt Guitarra", p: 2 }, { n: "Kit Ovinhos", p: 1 },
            { n: "Ovinho", p: 10 }, { n: "Fita SB", p: 25 },
            { n: "Autocolante", p: 35 }
        ];

        function drawWheel() {
            let angle = 0;
            premios.forEach((premio, index) => {
                const sliceAngle = (2 * Math.PI) / premios.length;
                ctx.beginPath();
                ctx.fillStyle = coresHino[index % coresHino.length]; // Alterna as cores da Hinoportuna
                ctx.moveTo(300, 300);
                ctx.arc(300, 300, 300, angle, angle + sliceAngle);
                ctx.fill();
                
                // Texto
                ctx.save();
                ctx.translate(300, 300);
                ctx.rotate(angle + sliceAngle / 2);
                ctx.fillStyle = (ctx.fillStyle === "#000000" || ctx.fillStyle === "#00008b") ? "#fff" : "#000"; // Cor do texto para contraste
                ctx.font = "bold 16px Arial";
                ctx.fillText(premio.n, 120, 5);
                ctx.restore();
                
                angle += sliceAngle;
            });
        }

        function girar(nome, premioGanhador) {
            const index = premios.findIndex(p => p.n === premioGanhador);
            const extraSpins = 6 * 360; 
            const sliceDeg = 360 / premios.length;
            // Sorteia um ângulo dentro da fatia para não parar sempre no mesmo sítio
            const randomOffset = (Math.random() * sliceDeg * 0.8) - (sliceDeg * 0.4); 
            const targetDeg = extraSpins + (360 - (index * sliceDeg)) - (sliceDeg/2) + randomOffset;
            
            canvas.style.transform = `rotate(${targetDeg}deg)`;
            
            setTimeout(() => {
                // Mostrar overlay de vencedor
                document.getElementById('vencedor-overlay').style.display = 'flex';
                document.getElementById('nome-vencedor').innerText = nome;
                document.getElementById('premio-vencedor').innerText = "Ganhaste: " + premioGanhador;
                
                // Limpar resultado no topo
                document.getElementById('resultado').innerText = "Aguardando Tunante para girar...";

                // Fechar automaticamente após 8 segundos
                setTimeout(() => {
                    document.getElementById('vencedor-overlay').style.display = 'none';
                    // Reiniciar posição da roleta sem animação
                    canvas.style.transition = "none";
                    canvas.style.transform = `rotate(${targetDeg % 360}deg)`;
                    setTimeout(() => canvas.style.transition = "transform 6s cubic-bezier(0.15, 0, 0.15, 1)", 100);
                }, 8000);
            }, 6500); // Mostra o resultado logo após a animação de 6s
        }

        // ESCUTAR O FIREBASE (Pedidos do Telemóvel)
        db.ref('pedidos').on('child_added', (snapshot) => {
            const dados = snapshot.val();
            // Evitar múltiplos giros simultâneos (pode ser melhorado)
            if (document.getElementById('resultado').innerText.includes("girar")) return;

            document.getElementById('resultado').innerText = dados.nome + " está a girar! Sorte, Tunante!";
            
            // Lógica simples de sorteio baseada em % (Isto será feito no Admin no futuro)
            let random = Math.random() * 100;
            let acumulado = 0;
            let escolhido = premios[premios.length-1].n;
            
            for(let p of premios) {
                acumulado += p.p;
                if(random <= acumulado) { escolhido = p.n; break; }
            }

            girar(dados.nome, escolhido);
            
            // Remove o pedido imediatamente para não repetir
            db.ref('pedidos/'+snapshot.key).remove();
        });

        drawWheel();
    </script>
</body>
</html>
