<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hinoportuna - Girar</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
</head>
<body style="background:#000; color:#fff; text-align:center; font-family:sans-serif; padding:50px 20px;">

    <img src="logo_hinoportuna.png" style="width:150px;">
    <h2>Roleta Hinoportuna</h2>
    
    <input type="text" id="nome" placeholder="Teu Nome" style="padding:15px; width:80%; font-size:1.2rem; border-radius:10px; border:none;">
    <br><br>
    <button onclick="enviar()" style="padding:20px 40px; font-size:1.5rem; background:#ffcc00; border:none; border-radius:10px; font-weight:bold;">GIRAR AGORA!</button>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBVH7T8fgOQhwny3jolprJCLmbCjHBMmGQ",
            authDomain: "roleta-lethes.firebaseapp.com",
            databaseURL: "https://roleta-lethes-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "roleta-lethes",
            storageBucket: "roleta-lethes.firebasestorage.app",
            messagingSenderId: "539471979058",
            appId: "1:539471979058:web:e1636f48c93e0e50e0922b"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function enviar() {
            const nomeInput = document.getElementById('nome').value;
            if(!nomeInput) return alert("Escreve o teu nome!");

            // Tenta escrever na base de dados
            db.ref('pedidos').push({
                nome: nomeInput,
                timestamp: Date.now()
            }).then(() => {
                alert("Enviado! Olha para o Monitor!");
                document.getElementById('nome').value = "";
            }).catch((error) => {
                alert("Erro ao enviar: " + error.message);
            });
        }
    </script>
</body>
</html>
