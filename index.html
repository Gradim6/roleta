<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gira a Roleta - Hinoportuna</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <style>
        body { background: #000; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; }
        .logo { width: 200px; margin-bottom: 30px; }
        input { padding: 15px; width: 80%; border-radius: 10px; border: 2px solid #32CD32; background: #222; color: white; font-size: 1.2rem; margin-bottom: 20px; }
        button { padding: 15px 40px; border-radius: 10px; border: none; background: #ffcc00; color: #000; font-weight: bold; font-size: 1.3rem; cursor: pointer; box-shadow: 0 5px 15px rgba(255,204,0,0.4); }
        button:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <img src="logo_hinoportuna.png" class="logo" alt="Hinoportuna">
    
    <h2>Estás pronto para ganhar?</h2>
    <p>Inscreve o teu nome e olha para o monitor!</p>

    <input type="text" id="nomeCliente" placeholder="Escreve aqui o teu nome..." required>
    <br>
    <button onclick="enviarGiro()">GIRAR A ROLETA!</button>

    <script>
        // CONFIGURAÇÃO DO FIREBASE (Igual à anterior)
        const firebaseConfig = {
            apiKey: "AIzaSyBVH7T8fgOQhwny3jolprJCLmbCjHBMmGQ",
            authDomain: "roleta-lethes.firebaseapp.com",
            databaseURL: "https://roleta-lethes-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "roleta-lethes",
            storageBucket: "roleta-lethes.firebasestorage.app",
            messagingSenderId: "539471979058",
            appId: "1:539471979058:web:e1636f48c93e0e50e0922b",
            measurementId: "G-LC28QJSJ5C"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function enviarGiro() {
            const nome = document.getElementById('nomeCliente').value;
            if(nome.trim() === "") {
                alert("Diz-nos o teu nome primeiro!");
                return;
            }

            // Envia o nome para a base de dados
            db.ref('pedidos').push({
                nome: nome,
                timestamp: Date.now()
            }).then(() => {
                alert("Boa sorte! Vê a roleta a girar no monitor!");
                document.getElementById('nomeCliente').value = ""; // Limpa o campo
            });
        }
    </script>
</body>
</html>
