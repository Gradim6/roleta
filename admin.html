<!DOCTYPE html>
<html>
<head>
    <title>Admin - Roleta Hinoportuna</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
        .stock-baixo { color: red; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Painel de Controlo - Hinoportuna</h2>
        <p>Aqui podes ver o histórico e ajustar stock (em breve).</p>
    </div>

    <div class="card">
        <h3>Últimos Ganhadores</h3>
        <table id="tabela-ganhadores">
            <tr>
                <th>Nome</th>
                <th>Prémio</th>
                <th>Hora</th>
            </tr>
        </table>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBVH7T8fgOQhwny3jolprJCLmbCjHBMmGQ",
            authDomain: "roleta-lethes.firebaseapp.com",
            databaseURL: "https://roleta-lethes-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "roleta-lethes",
            storageBucket: "roleta-lethes.firebasestorage.app",
            messagingSenderId: "539471979058",
            appId: "1:539471979058:web:e1636f48c93e0e50e0922b"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Escutar histórico de ganhadores
        db.ref('historico').limitToLast(10).on('child_added', (snapshot) => {
            const dado = snapshot.val();
            const tabela = document.getElementById('tabela-ganhadores');
            const row = tabela.insertRow(1);
            row.insertCell(0).innerText = dado.nome;
            row.insertCell(1).innerText = dado.premio;
            row.insertCell(2).innerText = new Date(dado.timestamp).toLocaleTimeString();
        });
    </script>
</body>
</html>
