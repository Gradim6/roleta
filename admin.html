<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Admin Hinoportuna</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: center; }
        th { background: #005ea8; color: white; }
        .btn-save { background: #32CD32; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; width: 100%; margin-top: 10px; font-weight: bold; }
        input { width: 80%; padding: 5px; }
    </style>
</head>
<body>

<div class="card">
    <h2>📦 Configuração de Brindes</h2>
    <table>
        <thead><tr><th>Nome</th><th>Stock</th><th>Prob %</th><th>Ação</th></tr></thead>
        <tbody id="corpo-premios"></tbody>
    </table>
    <button onclick="adicionarLinha()" style="margin-top:10px;">➕ Adicionar</button>
    <button class="btn-save" onclick="salvarConfig()">💾 GUARDAR TUDO</button>
</div>

<div class="card">
    <h2>🕒 Últimos Ganhadores</h2>
    <table>
        <thead><tr><th>Nome</th><th>Ganhou</th><th>Hora</th></tr></thead>
        <tbody id="corpo-historico"></tbody>
    </table>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBVH7T8fgOQhwny3jolprJCLmbCjHBMmGQ",
        authDomain: "roleta-lethes.firebaseapp.com",
        databaseURL: "https://roleta-lethes-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "roleta-lethes",
        appId: "1:539471979058:web:e1636f48c93e0e50e0922b"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Carregar configurações
    db.ref('configuracao_premios').on('value', (snap) => {
        const data = snap.val() || [];
        const tbody = document.getElementById('corpo-premios');
        tbody.innerHTML = "";
        data.forEach((item, i) => {
            tbody.innerHTML += `<tr>
                <td><input type="text" class="p-n" value="${item.n}"></td>
                <td><input type="number" class="p-s" value="${item.s}"></td>
                <td><input type="number" class="p-p" value="${item.p}"></td>
                <td><button onclick="this.parentElement.parentElement.remove()">❌</button></td>
            </tr>`;
        });
    });

    function adicionarLinha() {
        const tbody = document.getElementById('corpo-premios');
        tbody.innerHTML += `<tr><td><input type="text" class="p-n" value="Novo"></td><td><input type="number" class="p-s" value="10"></td><td><input type="number" class="p-p" value="0"></td><td><button onclick="this.parentElement.parentElement.remove()">❌</button></td></tr>`;
    }

    function salvarConfig() {
        const ns = document.querySelectorAll('.p-n'), ss = document.querySelectorAll('.p-s'), ps = document.querySelectorAll('.p-p');
        const novos = [];
        ns.forEach((n, i) => novos.push({ n: n.value, s: parseInt(ss[i].value), p: parseInt(ps[i].value) }));
        db.ref('configuracao_premios').set(novos);
        alert("Guardado!");
    }

    // Histórico em tempo real
    db.ref('historico').limitToLast(15).on('value', (snap) => {
        const tbody = document.getElementById('corpo-historico');
        tbody.innerHTML = "";
        const lista = [];
        snap.forEach(c => lista.unshift(c.val()));
        lista.forEach(v => {
            tbody.innerHTML += `<tr><td>${v.nome}</td><td>${v.premio}</td><td>${new Date(v.timestamp).toLocaleTimeString()}</td></tr>`;
        });
    });
</script>
</body>
</html>
