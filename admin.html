<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Gestão Total - Hinoportuna</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: center; }
        th { background: #005ea8; color: white; }
        input { padding: 5px; border-radius: 4px; border: 1px solid #ccc; width: 90%; }
        .btn { border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; margin: 5px; }
        .btn-save { background: #32CD32; color: white; }
        .btn-add { background: #005ea8; color: white; }
        .btn-del { background: #ff4444; color: white; padding: 5px 10px; }
    </style>
</head>
<body>

<div class="card">
    <h2>📦 Gestão de Brindes, Stock e Probabilidades</h2>
    <table id="tabela-premios">
        <thead>
            <tr>
                <th>Nome do Brinde</th>
                <th>Stock</th>
                <th>Probabilidade (%)</th>
                <th>Ação</th>
            </tr>
        </thead>
        <tbody id="corpo-premios"></tbody>
    </table>
    <br>
    <button class="btn btn-add" onclick="adicionarLinha()">➕ Adicionar Novo Brinde</button>
    <button class="btn btn-save" onclick="salvarConfig()">💾 Guardar Todas as Alterações</button>
    <p><small>* Certifica-te que a soma das probabilidades é 100%.</small></p>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBVH7T8fgOQhwny3jolprJCLmbCjHBMmGQ",
        authDomain: "roleta-lethes.firebaseapp.com",
        databaseURL: "https://roleta-lethes-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "roleta-lethes",
        storageBucket: "roleta-lethes.firebasestorage.app",
        messagingSenderId: "539471979058",
        appId: "1:539471979058:web:e1636f48c93e0e50e0922b"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Carregar dados existentes
    db.ref('configuracao_premios').on('value', (snap) => {
        const data = snap.val() || [];
        const tbody = document.getElementById('corpo-premios');
        tbody.innerHTML = "";
        data.forEach((item, index) => {
            renderizarLinha(item.n, item.s, item.p);
        });
    });

    function renderizarLinha(nome = "", stock = 0, prob = 0) {
        const tbody = document.getElementById('corpo-premios');
        const row = tbody.insertRow();
        row.innerHTML = `
            <td><input type="text" class="p-nome" value="${nome}"></td>
            <td><input type="number" class="p-stock" value="${stock}"></td>
            <td><input type="number" class="p-prob" value="${prob}"></td>
            <td><button class="btn-del" onclick="this.parentElement.parentElement.remove()">Remover</button></td>
        `;
    }

    function adicionarLinha() {
        renderizarLinha("Novo Item", 10, 0);
    }

    function salvarConfig() {
        const nomes = document.querySelectorAll('.p-nome');
        const stocks = document.querySelectorAll('.p-stock');
        const probs = document.querySelectorAll('.p-prob');
        const novosDados = [];
        let somaProb = 0;

        nomes.forEach((n, i) => {
            const p = parseInt(probs[i].value);
            somaProb += p;
            novosDados.push({
                id: i,
                n: n.value,
                s: parseInt(stocks[i].value),
                p: p
            });
        });

        if (somaProb !== 100) {
            alert("Aviso: A soma das probabilidades é " + somaProb + "%. Tenta ajustar para 100%!");
        }

        db.ref('configuracao_premios').set(novosDados);
        alert("Configurações guardadas com sucesso!");
    }
</script>
</body>
</html>
